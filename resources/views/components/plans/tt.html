      document.addEventListener("DOMContentLoaded", function () {
            const validTabs = ["1400", "1700", "2000"];
            const tabs = document.querySelectorAll(".tab-btn");
            const tabContent = document.getElementById("tab-content");
            const durationContent = document.getElementById("duration-content");
            const durationButtons = document.querySelectorAll(".duration-btn");
            const dayContent = document.getElementById("day-content");
            const dayButtons = document.querySelectorAll(".day-btn");
            const mealContent = document.getElementById("meal-content");
            const mealButtons = document.querySelectorAll(".meal-btn");

            tabs.forEach(tab => {
                tab.addEventListener("click", function () {
                    const tabId = this.dataset.tab;

                    if (!validTabs.includes(tabId)) {
                        alert("Invalid calorie tab selected.");
                        return;
                    }

                    // Highlight selected tab
                    tabs.forEach(t => {
                        t.classList.remove("text-green-600", "border-green-600");
                        t.classList.add("text-gray-600", "hover:text-green-600", "border-transparent");
                    });
                    this.classList.remove("text-gray-600", "hover:text-green-600", "border-transparent");
                    this.classList.add("text-green-600", "border-green-600");

                    // Show duration selection
                    durationContent.classList.remove("hidden");

                    // Hide day selection
                    dayContent.classList.add("hidden");

                    // Update tab content placeholder
                    tabContent.innerHTML = `<p class='text-center'>You selected ${tabId} kcal meals. Now select a duration.</p>`;
                });
            });

            durationButtons.forEach(button => {
                button.addEventListener("click", function () {
                    const duration = this.dataset.duration;

                    // Show day selection
                    dayContent.classList.remove("hidden");

                    tabContent.innerHTML = `<p class='text-center'>You selected a ${duration}-day plan. Now select a day.</p>`;
                });
            });

            dayButtons.forEach(button => {
                button.addEventListener("click", function () {
                    const day = this.dataset.day;

                    // Highlight selected day
                    dayButtons.forEach(d => {
                        d.classList.remove("bg-green-600", "text-white");
                        d.classList.add("bg-gray-200", "hover:bg-green-600", "hover:text-white");
                    });
                    this.classList.remove("bg-gray-200", "hover:bg-green-600", "hover:text-white");
                    this.classList.add("bg-green-600", "text-white");

                    tabContent.innerHTML = `<p class='text-center'>You selected ${day.charAt(0).toUpperCase() + day.slice(1)}.</p>`;
                });
            });
            mealButtons.forEach(button => {
            button.addEventListener("click", function () {
                const meal = this.dataset.meal;

                // Highlight selected meal
                mealButtons.forEach(m => {
                    m.classList.remove("bg-green-600", "text-white");
                    m.classList.add("bg-gray-200", "hover:bg-green-600", "hover:text-white");
                });
                this.classList.remove("bg-gray-200", "hover:bg-green-600", "hover:text-white");
                this.classList.add("bg-green-600", "text-white");

                tabContent.innerHTML = `<p class='text-center'>You selected ${meal.charAt(0).toUpperCase() + meal.slice(1)}.</p>`;
            });
        });
        });
    </script>
  </body>
</html>
